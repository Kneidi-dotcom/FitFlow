<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title slot="start">
      <img src="assets/images/LOGO.png" style="width: 80px; height: 80px">
    </ion-title>
    <ion-title>Registrierung</ion-title>
    <button slot="end" (click)="back()">Zurück</button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">registration</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="hero">
    <div class="container">
      <h2>Registriere dich und starte deine Fitness-Reise!</h2>
      <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="registration-form">
        <div class="form-group">
          <label for="username">Benutzername:</label>
          <input type="text" id="username" formControlName="username" required>
        </div>
        <div class="form-group">
          <label for="birthdate">Geburtsdatum:</label>
          <input type="date" id="birthdate" formControlName="birthdate" required>
        </div>
        <div class="form-group">
          <label for="email">E-Mail:</label>
          <input type="email" id="email" formControlName="email" required>
        </div>
        <div class="form-group">
          <label for="password_hash">Passwort:</label>
          <input type="password" id="password_hash" formControlName="password_hash" required>
        </div>
        <div class="form-group">
          <label for="experience">Erfahrungslevel:</label>
          <select id="experience" formControlName="experience" required>
            <option value="">Bitte auswählen...</option>
            <option value="anfänger">Anfänger</option>
            <option value="fortgeschritten">Fortgeschritten</option>
            <option value="experte">Experte</option>
          </select>
        </div>
        <div class="form-group">
          <label for="size">Größe (in cm):</label>
          <input type="number" id="size" formControlName="size" required>
        </div>
        <div class="form-group">
          <label for="bodyWeight">Körpergewicht (in kg):</label>
          <input type="number" id="bodyWeight" formControlName="bodyWeight" required>
        </div>
        <button type="submit" class="cta-button">Jetzt registrieren</button>
      </form>
    </div>
    <div>
      <p>Sie haben bereits ein Konto? <a (click)="login()">Hier zur Anmeldung</a></p>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2024 FitFlow. Alle Rechte vorbehalten.</p>
    </div>
  </footer>

</ion-content>
