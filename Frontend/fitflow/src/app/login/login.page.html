<ion-header [translucent]="true" >
  <ion-toolbar>
    <ion-title slot="start">
      <img src="assets/images/LOGO.png" style="width: 80px; height: 80px">
    </ion-title>
    <ion-title>Anmeldung</ion-title>
    <button slot="end" (click)="back()">Zurück</button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="hero">
    <div class="container">
      <h2>Melde dich jetzt an!</h2>
      <form (submit)="login($event)" class="registration-form">
        <div class="form-group">
          <label for="Username">Username:</label>
          <input type="Username" id="Username" #usernameInput name="username" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort:</label>
          <input type="password" id="password" #passwordInput name="password_hash" required>
        </div>
        <div>
          <p>Sie haben noch kein Konto? <a (click)="registration()">Hier eins erstellen</a></p>
        </div>
        <button type="submit" class="cta-button">Jetzt anmelden</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2024 FitFlow. Alle Rechte vorbehalten.</p>
    </div>
  </footer>
</ion-content>
